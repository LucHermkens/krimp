name: Krimp
options:
  bundleIdPrefix: io.github.luchermkens
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -Osize
      SWIFT_COMPILATION_MODE: wholemodule
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      COPY_PHASE_STRIP: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      LD_GENERATE_MAP_FILE: YES
      LD_MAP_FILE_PATH: $(BUILD_DIR)/$(PRODUCT_NAME)-LinkMap.txt
targets:
  Krimp:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Krimp.xcconfig
      Release: Config/Krimp.xcconfig
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Krimp
        CFBundleName: Krimp
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHumanReadableCopyright: "Copyright © 2026 Luc Hermkens. Licensed under GPL-3.0-or-later."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
              - public.svg-image
              - io.github.luchermkens.krimp.svgz
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.github.luchermkens.krimp.svgz
            UTTypeDescription: Compressed SVG image
            UTTypeConformsTo: [public.image, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [svgz]
    preBuildScripts:
      - name: Build Rust core
        script: |
          "$SRCROOT/scripts/build-core.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/core/target/aarch64-apple-darwin/release/libkrimp_core.a
          - $(SRCROOT)/Bridge/krimp_core.h
  KrimpTests:
    # Not hosted in the app: the bundle compiles the model and pipeline sources itself, so tests
    # run in a plain xctest process without launching the UI.
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Model
      - path: App/Pipeline
      - path: Tests
        excludes: ["Fixtures/**"]
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Krimp
        link: false
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.luchermkens.krimp.tests
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Bridge
        OTHER_LDFLAGS: $(SRCROOT)/core/target/aarch64-apple-darwin/release/libkrimp_core.a -lc++
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

schemes:
  Krimp:
    build:
      targets:
        Krimp: all
        KrimpTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [KrimpTests]
    archive:
      config: Release
