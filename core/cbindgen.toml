language = "C"
include_guard = "KRIMP_CORE_H"
autogen_warning = "/* Generated by cbindgen from core/src. Do not edit. */"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
style = "both"
cpp_compat = true
usize_is_size_t = true

[export]
prefix = ""
# Internal jpegli shim, not part of the public ABI.
exclude = ["krimp_jpegli_encode", "krimp_jpegli_free"]

[enum]
prefix_with_name = false
rename_variants = "None"

[defines]
"feature = avif" = "KRIMP_FEATURE_AVIF"
"feature = svg-min" = "KRIMP_FEATURE_SVG_MIN"
