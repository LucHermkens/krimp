[package]
name = "krimp_core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
build = "build.rs"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["avif", "svg-min"]
avif = ["dep:ravif"]
svg-min = ["dep:oxvg_optimiser", "dep:oxvg_ast"]

[dependencies]
flate2 = "1"
gif = { version = "0.14.2", default-features = false, features = ["std"] }
imagequant = { version = "4.4.1", default-features = false, features = ["threads"] }
libwebp-sys = { version = "0.14.4", default-features = false, features = ["std", "parallel", "neon"] }
oxipng = { version = "10.2.1", default-features = false, features = ["parallel"] }
oxvg_ast = { version = "=0.0.9", optional = true, features = ["roxmltree"] }
oxvg_optimiser = { version = "=0.0.9", optional = true }
ravif = { version = "0.13.0", optional = true }
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "svgz", "raster-images"] }
rgb = "0.8"
roxmltree = "0.21"
serde_json = { version = "1", optional = false }

[build-dependencies]
cc = "1"
cmake = "0.1"

[dev-dependencies]
image-webp = "0.2"
png = "0.18"
ssimulacra2 = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# Proc macros and build scripts: stripping them removes the metadata rustc needs to load them.
[profile.release.build-override]
strip = false

# Size: SVG minification, parsing and font shaping run once per file on small inputs, so they
# are built for size. The codecs (rav1e, imagequant, oxipng, libdeflate, tiny-skia) stay at -O3.
[profile.release.package]
lightningcss = { opt-level = "z" }
cssparser = { opt-level = "z" }
parcel_selectors = { opt-level = "z" }
selectors = { opt-level = "z" }
oxvg_ast = { opt-level = "z" }
oxvg_collections = { opt-level = "z" }
oxvg_optimiser = { opt-level = "z" }
oxvg_parse = { opt-level = "z" }
oxvg_path = { opt-level = "z" }
oxvg_serialize = { opt-level = "z" }
regex = { opt-level = "z" }
regex-automata = { opt-level = "z" }
regex-syntax = { opt-level = "z" }
aho-corasick = { opt-level = "z" }
serde_json = { opt-level = "z" }
usvg = { opt-level = "z" }
harfrust = { opt-level = "z" }
skrifa = { opt-level = "z" }
read-fonts = { opt-level = "z" }
roxmltree = { opt-level = "z" }
svgtypes = { opt-level = "z" }
fontdb = { opt-level = "z" }
